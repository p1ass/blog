    <rect x="840" y="426" width="250" height="84" rx="10" fill="#ffffff" stroke="#42464c" stroke-width="2"/>
    <text x="965" y="475" fill="#1e2126" font-weight="bold">isuq</text>
    <rect x="370" y="426" width="250" height="84" rx="10" fill="#e8f5fe" stroke="#4172b5" stroke-width="2"/>
    <text x="495" y="475" fill="#1e2126" font-weight="bold">分析の Agent</text>
    <rect x="40" y="50" width="160" height="84" rx="10" fill="#fff4e5" stroke="#a35b00" stroke-width="2"/>
