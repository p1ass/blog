    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a35b00"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4172b5"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
    <rect x="340" y="24" width="780" height="512" rx="24" fill="#f9f9fa" stroke="#cfe2fc" stroke-width="2"/>
  <text x="730" y="288" font-size="22" fill="#4172b5" font-weight="bold" text-anchor="middle">改善のループ</text>
    <g font-size="19" text-anchor="middle">
    <rect x="370" y="50" width="250" height="84" rx="10" fill="#e8f5fe" stroke="#4172b5" stroke-width="2"/>
    <text x="495" y="99" fill="#1e2126" font-weight="bold">司令塔の Agent</text>
    <rect x="840" y="50" width="250" height="84" rx="10" fill="#e8f5fe" stroke="#4172b5" stroke-width="2"/>
