name: VRT
on: [ pull_request ]
jobs:
  vrt:
    runs-on: ubuntu-latest
    # vrt/docker-run.sh と同じイメージにして、フォントのレンダリングを揃える。
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          # 別の版で入れると、触っていない pnpm-lock.yaml まで書き換わる。
          version: 10.8.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 素の Playwright イメージには和文フォントが無く、sans-serif が中国語のフォントに解決される。
      - name: Install fonts
        run: ./vrt/install-fonts.sh
      - name: Build blog
        run: pnpm build
      - name: Run visual regression tests
        run: pnpm exec playwright test
      - name: Upload diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-diff
          path: vrt/.results
          retention-days: 7
