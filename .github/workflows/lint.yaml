name: Lint
on: [ pull_request ]
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      # version: latest だと、コードを変えていなくても biome のリリースで CI が落ちる。
      - name: Run Biome
        run: pnpm exec biome ci .

  # scripts/ は Node の型剥がしでそのまま動かすので、22.18 以降が要る。
  style-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check style tokens
        run: pnpm run lint:style

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run tests
        run: pnpm test

  textlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Collect changed articles
        id: changed
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          files=$(node scripts/list-prose-changes.ts "origin/${{ github.base_ref }}")
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "本文が変わったファイル: ${files:-なし}"
      - name: Run textlint
        # 既存記事の指摘で CI が落ちないよう、本文が変わったファイルに限る。
        if: steps.changed.outputs.files != ''
        run: pnpm exec textlint ${{ steps.changed.outputs.files }}
