name: Lint
on: [ pull_request ]
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      # package.json に固定した版を使う。version: latest だと、コードを変えて
      # いなくても biome のリリースで CI が落ちる。
      - name: Run Biome
        run: pnpm exec biome ci .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run tests
        run: pnpm test

  textlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 変更ファイルを算出するために base との比較が必要
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Collect changed articles
        id: changed
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          # 記事と Skill 文書とソースコードの日本語コメントは同じルールに従う。
          # frontmatter だけの変更 (日付の統一など) では既存の文章を検査しない。
          files=$(node scripts/list-prose-changes.mjs "origin/${{ github.base_ref }}")
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "本文が変わったファイル: ${files:-なし}"
      - name: Run textlint
        # 本文の変更がない PR ではスキップする。既存記事の指摘で CI が落ちないよう、対象は本文が変わったファイルに限定している。
        if: steps.changed.outputs.files != ''
        run: pnpm exec textlint ${{ steps.changed.outputs.files }}
