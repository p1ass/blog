<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  VRT のコンテナでの書体の解決先を固定する。

  本番のスタイルは触らない。読者に見える書体は今までどおり OS まかせで、
  macOS ならヒラギノが最優先になる。ここで固定するのは基準画像の中だけ。

  素の Playwright イメージには和文フォントが 1 つも入っておらず、
  sans-serif が中国語の WenQuanYi Zen Hei に落ちる。字形が日本語と違うため、
  そのままでは基準画像として読めるものにならない。
-->
<fontconfig>
  <!-- CSS が名指しするが Linux に存在しないファミリの受け皿。
       prefer は「そのファミリが見つからなければ次を使う」という意味なので、
       将来コンテナに実物が入れば、そちらが優先される。 -->
  <alias>
    <family>Hiragino Kaku Gothic ProN</family>
    <prefer><family>Gen Interface JP</family></prefer>
  </alias>
  <alias>
    <family>Hiragino Sans</family>
    <prefer><family>Gen Interface JP</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Gen Interface JP</family></prefer>
  </alias>
  <alias>
    <family>Roboto</family>
    <prefer><family>Gen Interface JP</family></prefer>
  </alias>
  <alias>
    <family>Noto Sans CJK JP</family>
    <prefer><family>Gen Interface JP</family></prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Gen Interface JP</family></prefer>
  </alias>

  <!-- コード中の日本語コメントが中国語の字形にならないようにする。
       欧文と記号は DejaVu Sans Mono のまま。 -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Gen Interface JP</family>
    </prefer>
  </alias>
</fontconfig>
